# cbindgen configuration for crates/stickshift-capi/include/stickshift.h.
# Regenerate with scripts/gen-header.sh; CI fails if the committed header drifts.

language = "C"
# `extern "C"` guards, so a C++ host can include the header too.
cpp_compat = true
include_guard = "STICKSHIFT_H"
autogen_warning = """/*
 * Generated by cbindgen from crates/stickshift-capi. Do not edit by hand:
 * run scripts/gen-header.sh. The contract is docs/C_API.md.
 */"""
header = """/*
 * stickshift.h: the Stick Shift Engine C API (v0.1.0-beta.1, asynchronous in shape).
 *
 * Copyright (c) 2026 Parsa Bagheri. Released under the Apache-2.0 License.
 */"""
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "doxy"
# `typedef struct Name { ... } Name;`, so C code can say `StickShiftMesh` without `struct`.
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
# The handle and descriptor types are reachable from the functions, but list the
# constants' alias types explicitly so their typedefs are always emitted.
include = [
    "StickShiftResult",
    "StickShiftBackend",
    "StickShiftResourceState",
    "StickShiftEventType",
    "StickShiftVertexLayout",
    "StickShiftShadowQuality",
    "StickShiftFill",
]

[const]
allow_static_const = false
