[package]
name = "stickshift-core"
description = "Application lifecycle and platform layer for Stick Shift Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
stickshift-math.workspace = true
# The audio layer. `stickshift-audio` is a leaf that owns the `kira`/`cpal`
# dependency, and `stickshift-core` is its only engine-side consumer: the loop owns one
# `Audio` and hands it to the game through `EngineCtx`. No other engine crate —
# and nothing below the render seam — gains an audio dependency.
stickshift-audio.workspace = true
stickshift-ecs.workspace = true
stickshift-camera.workspace = true
stickshift-scene.workspace = true
stickshift-render-api.workspace = true
stickshift-perf.workspace = true
winit.workspace = true

# Native platform UI: the built-in Graphics menu (`NSMenu`) and settings
# persistence (`NSUserDefaults`). Same objc2 versions winit 0.30 already builds,
# so no new crates enter the build; AppKit's Metal/QuartzCore features stay off,
# so `metal` stays out of this crate's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
