[package]
name = "kaman-render"
description = "Raw-Metal implementation of the kaman-render-api seam for KamanEngine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The ray tracer is off by default. KE-0106 formalizes the gating and the iOS
# exclusion; here it merely keeps the default build rasterization-only so that
# `raytracing.metal` is never compiled unless explicitly requested.
default = []
raytracer = []

# ASTC compressed base-color textures on device (KE-0403). OFF by default: macOS
# on the Command Line Tools has no ASTC transcoder, so RGBA8 is the accepted
# fallback and `create_texture` uploads uncompressed. A device/mobile build turns
# this on to upload pre-compressed ASTC blocks (`texture_pixel_format` flips to
# `ASTC_4x4_LDR`). Structured behind this feature so the desktop path is unchanged.
astc-textures = []

# Precompiled shaders (KE-0107, partial). OFF by default so the engine builds with
# only the Command Line Tools (shaders compile at runtime via new_library_with_source).
# When ON, build.rs compiles shaders/*.metal to a .metallib ahead of time and the
# backend loads it via new_library_with_data — this REQUIRES the Metal toolchain (full
# Xcode). See scripts/preflight.sh --ios. Enable once Xcode is installed.
precompiled-shaders = []

# The `objc` 0.2 `msg_send!`/`sel_impl!` macros emit a `cfg(cargo-clippy)` check
# that trips `unexpected_cfgs` on our call sites (the cfg is defined by clippy,
# not us). Allow that one unknown cfg value so `-D warnings` stays clean; it is a
# third-party-macro artifact, not our code. KE-0107 revisits the objc glue.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }

[dependencies]
kaman-math.workspace = true
kaman-render-api.workspace = true
metal.workspace = true
block.workspace = true
objc.workspace = true
cocoa.workspace = true
core-graphics-types.workspace = true
raw-window-handle.workspace = true
winit.workspace = true

[dev-dependencies]
# Tests build a real Camera to produce the view-projection they push through the
# seam (`set_view_projection`). The backend itself owns no camera and never
# depends on kaman-camera.
kaman-camera.workspace = true
