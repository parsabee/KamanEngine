[package]
name = "stickshift-render-api"
description = "Backend-agnostic render seam (RenderDevice/FrameRecorder traits) for Stick Shift Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
stickshift-math.workspace = true

[dev-dependencies]
# Only the tests use a real Camera to produce a view-projection matrix; the seam
# itself carries a plain `Mat4` and never depends on stickshift-camera (dev-only, and
# stickshift-camera pulls in no metal, so the "no metal above the seam" firewall holds).
stickshift-camera.workspace = true
