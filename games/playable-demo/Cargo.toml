[package]
name = "playable-demo"
description = "Playable Demo — KamanEngine's reference example game (an endless runner). Also hosts the headless smoke oracle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "playable-demo"
path = "src/main.rs"

# `image` is a **dev-dependency only** (the `gen_asphalt` example uses it to bake
# the committed asphalt PNG). The runtime never gains an `image` dep — it decodes
# the embedded PNG through `kaman-assets` at import time.
[dev-dependencies]
image.workspace = true

[dependencies]
clap.workspace = true
kaman-assets.workspace = true
kaman-camera.workspace = true
kaman-core.workspace = true
kaman-ecs.workspace = true
kaman-math.workspace = true
kaman-render-api.workspace = true
kaman-scene.workspace = true

# The Metal backend lives below the render seam. Only the game binary depends on
# `kaman-render` (and thus `metal`); it constructs the backend and hands it to
# the engine via a factory, so `kaman-core` stays metal-free (ARCHITECTURE §2).
[target.'cfg(target_os = "macos")'.dependencies]
kaman-render.workspace = true
