name: Docs

# Build the rustdoc API documentation and publish it to GitHub Pages on every push to main.
# The generated site lives at https://parsabee.github.io/KamanEngine/.
#
# One-time setup: Repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# (The configure-pages step below also attempts to enable it automatically.)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macOS because kaman-render depends on the macOS-only `metal` crate.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Build our crates' docs only (no deps), and fail on broken intra-doc links.
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -A rustdoc::redundant_explicit_links"
        run: cargo doc --workspace --no-deps

      # rustdoc has no workspace index; generate a landing page linking each crate.
      - name: Landing page
        run: |
          cd target/doc
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>KamanEngine — API docs</title>'
            echo '<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem}a{text-decoration:none}li{margin:.3rem 0}</style>'
            echo '</head><body><h1>KamanEngine — API documentation</h1>'
            echo '<p>Generated by <code>cargo doc</code>. See also the'
            echo '<a href="https://github.com/parsabee/KamanEngine/blob/main/docs/DESIGN.md">design diagrams</a>.</p><ul>'
            for c in kaman_math kaman_perf kaman_ecs kaman_camera kaman_physics kaman_render_api kaman_scene kaman_assets kaman_render kaman_core car_runner; do
              [ -f "$c/index.html" ] && echo "<li><a href=\"$c/index.html\"><code>$c</code></a></li>"
            done
            echo '</ul></body></html>'
          } > index.html
          touch .nojekyll   # keep rustdoc's underscore-prefixed asset dirs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
