name: CI

# The macOS oracle: every push/PR must build, test, lint clean, and boot the headless smoke
# oracle. Red blocks merge. See docs/INTEGRATION.md §1.
#
# Also runs on release tags (`v*`, e.g. `v0.1.0-alpha.1`) so every tagged release has its own
# green run, and on demand from the Actions tab / `gh workflow run ci.yml --ref main`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: build / test / clippy / smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Install exactly the toolchain pinned in rust-toolchain.toml (channel + components), so CI
      # builds with the same rustc as contributors. Argument-less `rustup toolchain install` reads
      # the toolchain file (rustup >= 1.28); the version check fails the job if the pin is ignored.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc --version
          rustc --version | grep -q " $pinned " || { echo "rustc is not the pinned $pinned"; exit 1; }

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Verify the project's declared toolchain dependencies are present before building.
      # Default tier only (iOS/.metallib tier is enforced with --ios once Phase 3 starts).
      - name: Toolchain preflight
        run: ./scripts/preflight.sh

      - name: Build workspace
        run: cargo build --workspace

      # Render-seam dependency firewall (docs/ARCHITECTURE.md §2). kaman-render-api defines the
      # render contract; it must never depend on `metal`. Fail if `metal` appears anywhere in
      # this crate's normal dependency tree. `grep -q` exits 0 on a match, so negation makes the
      # step fail when metal is present and pass when it is absent.
      - name: Render seam has no metal dependency
        run: "! cargo tree -p kaman-render-api -e normal | grep -qi metal"

      # De-brand guard (KE-0007, docs/ROADMAP.md KR0.5). No prototype identifiers may appear in
      # shipped engine code; provenance lives in docs/ only. Scans crates/ and games/; grep exits
      # 0 on a match, so the negation fails the step when an identifier is found.
      - name: No prototype identifiers in shipped code
        run: "! grep -rniI projectrigor crates games"

      # Ticket format + progress (scripts/check-tickets.py). Fails if any KE-*.md ticket breaks the
      # header schema; also prints the per-phase completion report.
      - name: Ticket format lint
        run: python3 scripts/check-tickets.py

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docs must generate with no broken/private intra-doc links (rustdoc). Cosmetic
      # redundant-explicit-link nags are allowed. Keeps `cargo doc` output clean.
      - name: Rustdoc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -A rustdoc::redundant_explicit_links"
        run: cargo doc --workspace --no-deps

      # Raytracer is a desktop-only, off-by-default feature (KE-0106, KR1.4). Keep the feature
      # path compiling and lint-clean so it does not rot; the default build above proves the
      # rasterization path never pulls it in.
      - name: Build + clippy raytracer feature (macOS)
        run: |
          cargo build -p kaman-render --features raytracer
          cargo clippy -p kaman-render --all-targets --features raytracer -- -D warnings

      # Headless smoke oracle. Metal API Validation is enabled here per the ticket so that,
      # once the renderer migrates in Phase 1, this run exercises it under validation. Today
      # the oracle is CPU-only and needs no GPU (CI runners are headless).
      - name: Smoke oracle (Metal API Validation on)
        env:
          METAL_DEVICE_WRAPPER_TYPE: "1"
        run: cargo run -p playable-demo -- --smoke
