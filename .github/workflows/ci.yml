name: CI

# The macOS oracle: every push/PR must build, test, lint clean, and boot the headless smoke
# oracle. Red blocks merge. See docs/INTEGRATION.md §1.
#
# Also runs on release tags (`v*`, e.g. `v0.1.0-alpha.1`) so every tagged release has its own
# green run, and on demand from the Actions tab / `gh workflow run ci.yml --ref main`.
# Pull requests are checked whatever their base, so a PR stacked on another PR's branch gets
# its own run instead of waiting until it is retargeted to main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: build / test / clippy / smoke (macOS)
    runs-on: macos-latest
    # The GPU tests skip without a Metal device; here a missing device fails them
    # instead, so a runner that lost its GPU cannot pass the render suite unrun.
    env:
      STICKSHIFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      # Install exactly the toolchain pinned in rust-toolchain.toml (channel + components), so CI
      # builds with the same rustc as contributors. Argument-less `rustup toolchain install` reads
      # the toolchain file (rustup >= 1.28); the version check fails the job if the pin is ignored.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc --version
          rustc --version | grep -q " $pinned " || { echo "rustc is not the pinned $pinned"; exit 1; }

      # Fail fast on unformatted code (rustfmt defaults); fix locally with `cargo fmt --all`.
      - name: Format check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Verify the project's declared toolchain dependencies are present before building.
      # Default tier only; the iOS/.metallib tier (`--ios`) is not required yet.
      - name: Toolchain preflight
        run: ./scripts/preflight.sh

      - name: Build workspace
        run: cargo build --workspace

      # Render-seam dependency firewall (docs/ARCHITECTURE.md §2). stickshift-render-api defines the
      # render contract; it must never depend on `metal`. Fail if `metal` appears anywhere in
      # this crate's normal dependency tree. `grep -q` exits 0 on a match, so negation makes the
      # step fail when metal is present and pass when it is absent.
      - name: Render seam has no metal dependency
        run: "! cargo tree -p stickshift-render-api -e normal | grep -qi metal"

      # De-brand guard. No prototype identifiers may appear in
      # shipped engine code; provenance lives in docs/ only. Scans crates/ and games/; grep exits
      # 0 on a match, so the negation fails the step when an identifier is found.
      - name: No prototype identifiers in shipped code
        run: "! grep -rniI projectrigor crates games"

      # Rename guard. The project's pre-rename name may stay only in the few places the script
      # lists (the changelog's history and the documented migration notes).
      - name: No pre-rename names
        run: ./scripts/check-renamed.sh

      - name: Test workspace
        run: cargo test --workspace

      # The C library is graphics-only: no windowing, audio, ECS or physics crate may reach
      # it. `grep -q` exits 0 on a match, so the negation fails the step when one does.
      - name: C library has no windowing/audio/ECS/physics dependency
        run: "! cargo tree -p stickshift-capi -e normal | grep -qiE 'winit|kira|cpal|rapier|hecs'"

      # stickshift.h is generated by cbindgen and committed; fail if it no longer matches the
      # Rust sources. The pinned cbindgen is cached in ~/.cargo/bin by rust-cache.
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.0 --locked

      - name: C header is up to date
        run: ./scripts/gen-header.sh --check

      # Compile the C smoke test and the C sample against stickshift.h + libstickshift.a with clang
      # (-Werror -pedantic) and run them on the runner's Metal device.
      - name: C API smoke test and sample (Metal)
        run: ./scripts/test-c-api.sh

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docs must generate with no broken/private intra-doc links (rustdoc). Cosmetic
      # redundant-explicit-link nags are allowed. Keeps `cargo doc` output clean.
      - name: Rustdoc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -A rustdoc::redundant_explicit_links"
        run: cargo doc --workspace --no-deps

      # Headless smoke oracle: runs the demo's game loop for 120 frames against the CPU-only
      # NullRenderer, so it needs no GPU. Metal API Validation stays on so any Metal use on this
      # path is validated.
      - name: Smoke oracle (Metal API Validation on)
        env:
          METAL_DEVICE_WRAPPER_TYPE: "1"
        run: cargo run -p playable-demo -- --smoke
