name: Release

# Build the prebuilt Apple Silicon tarball for a release tag and attach it (plus its .sha256) to
# the GitHub release. The Homebrew formula (packaging/homebrew/kaman-engine.rb, published in the
# parsabee/homebrew-kaman tap) downloads this asset. Packaging lives in
# scripts/package-release.sh so it can be run and checked locally.
#
# Runs on every `v*` tag push, or by hand for an existing tag:
#   gh workflow run release.yml -f tag=v0.1.0-alpha.2
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload (e.g. v0.1.0-alpha.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: package aarch64-apple-darwin
    # macos-latest is Apple Silicon (arm64), so the native build is the arm64 artefact.
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Resolve version
        id: version
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "tag '$TAG' does not start with v"; exit 1 ;;
          esac
          version="${TAG#v}"
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$version" = "$ws" ] || { echo "tag $TAG does not match workspace version $ws"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same as ci.yml: install exactly the toolchain pinned in rust-toolchain.toml, and fail if
      # the pin is ignored.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc --version
          rustc --version | grep -q " $pinned " || { echo "rustc is not the pinned $pinned"; exit 1; }

      - name: Build release binary
        run: cargo build --release -p playable-demo --locked

      - name: Verify binary (arm64, smoke)
        run: |
          file target/release/playable-demo
          [ "$(lipo -archs target/release/playable-demo)" = "arm64" ] || { echo "not arm64"; exit 1; }
          target/release/playable-demo --smoke

      # Stages bin/ + share/, tars it, writes the .sha256, then re-runs --smoke from an unpacked
      # copy to prove the packaged assets resolve.
      - name: Package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}" dist

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="dist/kaman-engine-${VERSION}-aarch64-apple-darwin.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
          else
            # SemVer pre-releases (anything with a `-`, e.g. -alpha.2) are marked as such.
            pre=()
            case "$VERSION" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" "$asset" "$asset.sha256" \
              "${pre[@]}" --verify-tag --title "$TAG" \
              --notes "Prebuilt Apple Silicon build of $TAG. See CHANGELOG.md for what changed."
          fi

      # Point the Homebrew tap (github.com/parsabee/homebrew-kaman) at this release, so
      # `brew install/upgrade parsabee/kaman/kaman-engine` serves it, and keep the canonical copy
      # in packaging/homebrew/ on main in sync. The tap is pushed with a write deploy key scoped to
      # that one repo (secret HOMEBREW_TAP_DEPLOY_KEY); main is pushed with this run's token
      # (pushes made with GITHUB_TOKEN don't re-trigger workflows). Without the secret the step
      # warns and skips, so forks and first-time setups still release.
      - name: Update Homebrew tap + canonical formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; skipping the Homebrew tap update"
            exit 0
          fi
          sha=$(cut -d' ' -f1 "dist/kaman-engine-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The job checked out the tag (detached). Switch to main first: the canonical formula is
          # committed there, and main's copy of update-homebrew-formula.sh is used for both files,
          # so re-running this for an older tag (workflow_dispatch) works even if the tag predates
          # the script.
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD

          key="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:parsabee/homebrew-kaman.git "$RUNNER_TEMP/tap"
          ./scripts/update-homebrew-formula.sh "$RUNNER_TEMP/tap/Formula/kaman-engine.rb" "$VERSION" "$sha"
          if git -C "$RUNNER_TEMP/tap" diff --quiet; then
            echo "tap already at $VERSION"
          else
            git -C "$RUNNER_TEMP/tap" commit -am "kaman-engine $VERSION" \
              -m "- Formula/kaman-engine.rb: url and sha256 for the $TAG release"
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" git -C "$RUNNER_TEMP/tap" push origin HEAD:main
          fi
          rm -f "$key"

          # Keep the canonical copy on main in sync.
          ./scripts/update-homebrew-formula.sh packaging/homebrew/kaman-engine.rb "$VERSION" "$sha"
          if git diff --quiet; then
            echo "packaging/homebrew already at $VERSION"
          else
            git commit -am "Homebrew formula: point at $TAG" \
              -m "- packaging/homebrew/kaman-engine.rb: url and sha256 for $TAG (updated by the release workflow)"
            git push origin main
          fi
