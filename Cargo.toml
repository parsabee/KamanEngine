[workspace]
resolver = "2"
members = [
    "crates/kaman-math",
    "crates/kaman-perf",
    "crates/kaman-ecs",
    "crates/kaman-physics",
    "crates/kaman-camera",
    "crates/kaman-scene",
    "crates/kaman-render-api",
    "crates/kaman-render",
    "crates/kaman-assets",
    "crates/kaman-core",
    "games/playable-demo",
]

# Shared package metadata. Individual crates inherit these via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Enforced by cargo on build (a required project
# dependency), matched to the channel pinned in rust-toolchain.toml, and re-checked
# by scripts/preflight.sh. Bump deliberately.
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Parsa Bagheri"]
repository = "https://github.com/parsabee/KamanEngine"

# Shared dependency versions (pinned from the original prototype; see docs/ARCHITECTURE.md
# Provenance). Crates opt in via
# `dep.workspace = true`. No crate migrates real logic in KE-0001 — these are here so later
# migration tickets (KE-0003+, Phase 1) inherit a single source of truth for versions.
[workspace.dependencies]
# Intra-workspace crates. Path deps live here too so every consumer resolves the
# same local copy without repeating the relative path.
kaman-math = { path = "crates/kaman-math" }
kaman-perf = { path = "crates/kaman-perf" }
kaman-ecs = { path = "crates/kaman-ecs" }
kaman-physics = { path = "crates/kaman-physics" }
kaman-camera = { path = "crates/kaman-camera" }
kaman-scene = { path = "crates/kaman-scene" }
kaman-render-api = { path = "crates/kaman-render-api" }
kaman-render = { path = "crates/kaman-render" }
kaman-assets = { path = "crates/kaman-assets" }
kaman-core = { path = "crates/kaman-core" }

glam = "0.29"
# glTF import (KE-0402): pure-Rust parser, builds on the Command Line Tools (no
# Metal / no C toolchain beyond std). `default-features` is disabled and only the
# `import` + `utils` features are enabled so no image/extras baggage is pulled in
# (textures are KE-0403).
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
# Image decoding (KE-0403): decode glTF base-color images (PNG/JPEG) to RGBA8 in
# `kaman-assets`. Pure-Rust codecs (no C toolchain beyond std); default features
# off so only the two codecs glTF assets commonly embed are pulled in — no metal,
# no game baggage. `kaman-assets` stays engine-generic and metal-free.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rapier3d = "0.22"
hecs = "0.10"
winit = { version = "0.30", features = ["rwh_06"] }
metal = "0.29"
block = "0.1"
objc = "0.2"
cocoa = "0.25"
core-graphics-types = "0.1"
raw-window-handle = "0.6"
clap = { version = "4.5", features = ["derive"] }
