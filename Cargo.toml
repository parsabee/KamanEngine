[workspace]
resolver = "2"
members = [
    "crates/kaman-math",
    "crates/kaman-perf",
    "crates/kaman-ecs",
    "crates/kaman-physics",
    "crates/kaman-camera",
    "crates/kaman-scene",
    "crates/kaman-render-api",
    "crates/kaman-render",
    "crates/kaman-core",
    "games/car-runner",
]

# Shared package metadata. Individual crates inherit these via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Parsa Bagheri"]
repository = "https://github.com/parsabagheri/KamanEngine"

# Shared dependency versions (pinned from the ProjectRigor prototype). Crates opt in via
# `dep.workspace = true`. No crate migrates real logic in KE-0001 — these are here so later
# migration tickets (KE-0003+, Phase 1) inherit a single source of truth for versions.
[workspace.dependencies]
glam = "0.29"
rapier3d = "0.22"
hecs = "0.10"
winit = { version = "0.30", features = ["rwh_06"] }
metal = "0.29"
clap = { version = "4.5", features = ["derive"] }
