[workspace]
resolver = "2"
members = [
    "crates/kaman-math",
    "crates/kaman-perf",
    "crates/kaman-ecs",
    "crates/kaman-physics",
    "crates/kaman-camera",
    "crates/kaman-scene",
    "crates/kaman-render-api",
    "crates/kaman-render",
    "crates/kaman-core",
    "games/car-runner",
]

# Shared package metadata. Individual crates inherit these via `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Enforced by cargo on build (a required project
# dependency), matched to the channel pinned in rust-toolchain.toml, and re-checked
# by scripts/preflight.sh. Bump deliberately.
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Parsa Bagheri"]
repository = "https://github.com/parsabee/KamanEngine"

# Shared dependency versions (pinned from the original prototype; see docs/ARCHITECTURE.md
# Provenance). Crates opt in via
# `dep.workspace = true`. No crate migrates real logic in KE-0001 — these are here so later
# migration tickets (KE-0003+, Phase 1) inherit a single source of truth for versions.
[workspace.dependencies]
# Intra-workspace crates. Path deps live here too so every consumer resolves the
# same local copy without repeating the relative path.
kaman-math = { path = "crates/kaman-math" }
kaman-perf = { path = "crates/kaman-perf" }
kaman-ecs = { path = "crates/kaman-ecs" }
kaman-render-api = { path = "crates/kaman-render-api" }
kaman-render = { path = "crates/kaman-render" }
kaman-core = { path = "crates/kaman-core" }

glam = "0.29"
rapier3d = "0.22"
hecs = "0.10"
winit = { version = "0.30", features = ["rwh_06"] }
metal = "0.29"
block = "0.1"
objc = "0.2"
cocoa = "0.25"
core-graphics-types = "0.1"
raw-window-handle = "0.6"
clap = { version = "4.5", features = ["derive"] }
